services:
  - type: web
    name: rigfy-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import os; from app.ml.pipeline import carregar_modelo; (carregar_modelo() is None and os.system('python scripts/treinar_modelo.py'))"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: ZENROWS_API_KEY
        sync: false
